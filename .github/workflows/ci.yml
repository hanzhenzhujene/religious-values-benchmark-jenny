name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - jenny/religion-harness

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make setup

      - name: Run tests
        run: make test

      - name: Rebuild release artifacts
        run: make bootstrap
